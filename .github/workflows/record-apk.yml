name: Run APK in emulator and record screen

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run APK and record 60 seconds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/run-apk.sh"

      - name: Upload 60-second recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-screen-recording-60s
          path: recording-60s.mp4
          if-no-files-found: warn

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore
